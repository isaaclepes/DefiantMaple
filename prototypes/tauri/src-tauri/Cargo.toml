[package]
name = "defiantmaple-tauri"
version = "0.0.0"
description = "Scoped DefiantMaple Tauri desktop stack prototype"
edition = "2024"
rust-version = "1.95"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
tauri = { version = "=2.11.6", features = [] }
# Tauri 2.11.6 declares these runtime versions. Without a lockfile, Cargo can
# select runtime 2.12 and fail inside Tauri before this prototype is compiled.
tauri-runtime = "=2.11.3"
tauri-runtime-wry = "=2.11.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
