name: Repeated scan characterization
on:
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      measure: ${{ steps.decision.outputs.measure }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 128
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - id: decision
        name: Authenticate publication delta and earlier canonical evidence
        run: python -W error::ResourceWarning -m scripts.scan_characterization_gate
  pair:
    needs: gate
    if: needs.gate.result == 'success' && needs.gate.outputs.measure == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26-intel]
        pair: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 55 || 35 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Measure one matched fictional pair
        run: >-
          python -W error::ResourceWarning -m benchmarks.source_scan_profile_series pair
          --count 2048 --page-size 256 --pairs 4 --pair-index ${{ matrix.pair }}
          --trial-timeout ${{ matrix.os == 'windows-latest' && 1440 || 720 }}
          --pair-timeout ${{ matrix.os == 'windows-latest' && 3000 || 1800 }}
          --revision ${{ github.sha }} --run-id ${{ github.run_id }}
          --run-attempt ${{ github.run_attempt }}
          --metrics source-scan-profile-pair.json
      - name: Retain complete or incomplete aggregate pair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-characterization-${{ runner.os }}-pair-${{ matrix.pair }}-attempt-${{ github.run_attempt }}
          path: source-scan-profile-pair.json
          if-no-files-found: error
  aggregate:
    needs: [gate, pair]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.measure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download current-attempt pair reports into separate directories
        uses: actions/download-artifact@v4
        with:
          pattern: scan-characterization-*-pair-*-attempt-${{ github.run_attempt }}
          path: characterization-pairs
          merge-multiple: false
      - name: Authenticate the complete platform and pair grid
        if: always()
        run: >-
          python -W error::ResourceWarning -m benchmarks.source_scan_profile_series aggregate
          --input-dir characterization-pairs --count 2048 --page-size 256 --pairs 4
          --platforms Linux Darwin Windows
          --revision ${{ github.sha }} --run-id ${{ github.run_id }}
          --run-attempt ${{ github.run_attempt }}
          --metrics source-scan-profile-series.json
      - name: Retain complete or incomplete series report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-characterization-series-attempt-${{ github.run_attempt }}
          path: source-scan-profile-series.json
          if-no-files-found: error
