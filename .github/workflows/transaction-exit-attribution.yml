name: Windows transaction-exit attribution
on:
  pull_request:
    # Preserve the finite diagnostic boundary for unrelated product changes.
    # Workflow/docs edits alone do not authorize a new attribution experiment.
    paths:
      - 'benchmarks/source_scan_profile.py'
      - 'benchmarks/source_scan_soak.py'
      - 'benchmarks/source_scan_profile_series.py'
      - 'benchmarks/source_scan_exit_probe.py'
      - 'benchmarks/source_scan_exit_series.py'
      - 'defiantmaple/catalog.py'
      - 'defiantmaple/sources.py'
      - 'defiantmaple/media.py'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      measure: ${{ steps.decision.outputs.measure }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 128
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - id: decision
        name: Authenticate publication delta and prior exit-only evidence
        run: python -W error::ResourceWarning -m scripts.transaction_exit_gate
  windows-series:
    needs: gate
    if: needs.gate.result == 'success' && needs.gate.outputs.measure == 'true'
    runs-on: windows-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Four balanced exit-only pairs on one Windows runner session
        run: >-
          python -W error::ResourceWarning -m benchmarks.source_scan_exit_series series
          --count 2048 --page-size 256 --pairs 4
          --trial-timeout 1440 --pair-timeout 3000
          --revision ${{ github.sha }} --head-sha ${{ github.event.pull_request.head.sha }}
          --run-id ${{ github.run_id }}
          --run-attempt ${{ github.run_attempt }} --job-id ${{ github.job }}
          --metrics transaction-exit-series.json
      - name: Retain bounded complete or incomplete diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-exit-series-Windows-attempt-${{ github.run_attempt }}
          path: transaction-exit-series.json
          if-no-files-found: error
